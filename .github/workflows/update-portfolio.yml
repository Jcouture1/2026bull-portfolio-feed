name: Update Portfolio Feed

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Create public directory
        run: mkdir -p public

      - name: Fetch wallet portfolio
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            "https://2026bull-portfolio-oracle.vercel.app/api/feed" \
            -o public/portfolio.json \
            || echo '{"status":"error"}' > public/portfolio.json

      - name: Fetch Pacifica account
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            "https://2026bull-portfolio-oracle.vercel.app/api/pacifica" \
            -o /tmp/pacifica.json \
            || echo '{"status":"error"}' > /tmp/pacifica.json

      - name: Validate wallet feed
        run: |
          if jq -e '.status == "ok"' public/portfolio.json > /dev/null 2>&1; then
            jq -e '.privacy.walletAddressesIncluded == false' public/portfolio.json > /dev/null
            jq -e '.privacy.apiKeysIncluded == false' public/portfolio.json > /dev/null
            jq -e '.privacy.signingCapability == false' public/portfolio.json > /dev/null
          else
            echo "::warning::wallet feed unavailable this cycle, will publish as a missing source"
          fi

      - name: Validate Pacifica feed
        run: |
          if jq -e '.status == "ok"' /tmp/pacifica.json > /dev/null 2>&1; then
            jq -e '.safety.walletAddressIncluded == false' /tmp/pacifica.json > /dev/null
            jq -e '.safety.privateKeyRequired == false' /tmp/pacifica.json > /dev/null
            jq -e '.safety.signingCapability == false' /tmp/pacifica.json > /dev/null
          else
            echo "::warning::Pacifica feed unavailable this cycle, will publish as a missing source"
          fi

      - name: Create readable portfolio feed
        run: |
          WALLET_OK=$(jq -r '.status == "ok"' public/portfolio.json)
          PACIFICA_OK=$(jq -r '.status == "ok"' /tmp/pacifica.json)

          MISSING=()

          SOLANA_VALUE="UNAVAILABLE"
          ROBINHOOD_VALUE="UNAVAILABLE"
          NFT_VALUE="UNAVAILABLE"

          if [ "$WALLET_OK" = "true" ]; then
            if [ "$(jq -r '.summary.bySource.solana.complete // false' public/portfolio.json)" = "true" ]; then
              SOLANA_VALUE=$(jq -r '.summary.bySource.solana.valueUsd // 0' public/portfolio.json)
            fi

            if [ "$(jq -r '.summary.bySource.robinhood.complete // false' public/portfolio.json)" = "true" ]; then
              ROBINHOOD_VALUE=$(jq -r '.summary.bySource.robinhood.valueUsd // 0' public/portfolio.json)
            fi

            if [ "$(jq -r '.summary.bySource.nft.complete // false' public/portfolio.json)" = "true" ]; then
              NFT_VALUE=$(jq -r '.summary.bySource.nft.valueUsd // 0' public/portfolio.json)
            fi

            while IFS= read -r source; do
              [ -n "$source" ] && MISSING+=("$source")
            done < <(jq -r '.summary.missingSources[]? // empty' public/portfolio.json)
          else
            MISSING+=("Wallet Feed (oracle unavailable)")
          fi

          PACIFICA_VALUE="UNAVAILABLE"

          if [ "$PACIFICA_OK" = "true" ]; then
            PACIFICA_VALUE=$(jq -r '.account.equity' /tmp/pacifica.json)
          else
            MISSING+=("Pacifica")
          fi

          TOTAL_VALUE=0
          [ "$SOLANA_VALUE" != "UNAVAILABLE" ] && TOTAL_VALUE=$(jq -n --argjson a "$TOTAL_VALUE" --argjson b "$SOLANA_VALUE" '$a + $b')
          [ "$ROBINHOOD_VALUE" != "UNAVAILABLE" ] && TOTAL_VALUE=$(jq -n --argjson a "$TOTAL_VALUE" --argjson b "$ROBINHOOD_VALUE" '$a + $b')
          [ "$NFT_VALUE" != "UNAVAILABLE" ] && TOTAL_VALUE=$(jq -n --argjson a "$TOTAL_VALUE" --argjson b "$NFT_VALUE" '$a + $b')
          [ "$PACIFICA_VALUE" != "UNAVAILABLE" ] && TOTAL_VALUE=$(jq -n --argjson a "$TOTAL_VALUE" --argjson b "$PACIFICA_VALUE" '$a + $b')

          if [ ${#MISSING[@]} -eq 0 ]; then
            STATUS="OK"
            MISSING_STR="none"
            TOTAL_COMPLETE="true"
          else
            STATUS="PARTIAL"
            printf -v MISSING_STR '%s, ' "${MISSING[@]}"
            MISSING_STR="${MISSING_STR%, }"
            TOTAL_COMPLETE="false"
          fi

          {
            echo "2026BULL PORTFOLIO"
            echo "=================="
            echo ""
            echo "STATUS: $STATUS"
            echo "MISSING_SOURCES: $MISSING_STR"
            echo ""
            echo "SOLANA_VALUE_USD: $SOLANA_VALUE"
            echo "ROBINHOOD_VALUE_USD: $ROBINHOOD_VALUE"
            echo "NFT_VALUE_USD: $NFT_VALUE"
            echo "PACIFICA_EQUITY_USD: $PACIFICA_VALUE"
            echo ""
            echo "TOTAL_KNOWN_VALUE_USD: $TOTAL_VALUE"
            echo "TOTAL_COMPLETE: $TOTAL_COMPLETE"

            if [ "$WALLET_OK" = "true" ]; then
              echo ""
              echo "UPDATED_AT: $(jq -r '.updatedAt' public/portfolio.json)"
              echo "PRICED_POSITIONS: $(jq -r '.summary.pricedPositions' public/portfolio.json)"
              echo "UNPRICED_POSITIONS: $(jq -r '.summary.unpricedPositions' public/portfolio.json)"
              echo "UNIQUE_ASSETS: $(jq -r '.summary.uniqueAssets' public/portfolio.json)"
              echo ""
              echo "WALLET POSITIONS"
              echo "================"
              echo -e "CHAIN\tSYMBOL\tNAME\tCONTRACT\tBALANCE\tPRICE_USD\tVALUE_USD\t24H_PCT\tLIQUIDITY_USD"

              jq -r '
                .positions
                | sort_by(-(.valueUsd // -1))
                | .[]
                | [
                    (.chain // ""),
                    (.symbol // ""),
                    (.name // ""),
                    (.tokenAddress // "native"),
                    (.balance | tostring),
                    ((.priceUsd // "UNPRICED") | tostring),
                    ((.valueUsd // "UNPRICED") | tostring),
                    ((.priceChange24h // "") | tostring),
                    ((.liquidityUsd // "") | tostring)
                  ]
                | @tsv
              ' public/portfolio.json

              echo ""
              echo "NFT HOLDINGS"
              echo "============"
              echo -e "LABEL\tCONTRACT\tQUANTITY\tFLOOR_NATIVE\tFLOOR_USD\tVALUE_USD\tSTATUS"

              jq -r '
                .nftHoldings[]?
                | [
                    (.label // ""),
                    (.contract // ""),
                    (.quantity | tostring),
                    ((.floorPriceNative // "UNAVAILABLE") | tostring),
                    ((.floorPriceUsd // "UNAVAILABLE") | tostring),
                    ((.valueUsd // "UNAVAILABLE") | tostring),
                    (.status // "")
                  ]
                | @tsv
              ' public/portfolio.json

              echo ""
              echo "QUARANTINED TOKENS"
              echo "=================="

              if [ "$(jq -r '(.quarantined // []) | length' public/portfolio.json)" = "0" ]; then
                echo "none"
              else
                jq -r '
                  .quarantined[]
                  | "SYMBOL: \(.symbol // "UNKNOWN")\nCONTRACT: \(.contract // "")\nWALLET: \(.wallet // "")\nSECURITY_STATUS: \(.securityStatus // "QUARANTINED")\nPRICE_USD: \(.priceUsd // "ignored")\nVALUE_USD: \(.valueUsd // 0)\nINCLUDED_IN_TOTAL: \(.includedInTotal // false)\nREASON: \(.reason // "")\n"
                ' public/portfolio.json
              fi
            else
              echo ""
              echo "WALLET POSITIONS: UNAVAILABLE THIS CYCLE"
            fi

            if [ "$PACIFICA_OK" = "true" ]; then
              echo ""
              echo "PACIFICA"
              echo "========"
              echo "EQUITY_USD: $(jq -r '.account.equity' /tmp/pacifica.json)"
              echo "BALANCE_USD: $(jq -r '.account.balance' /tmp/pacifica.json)"
              echo "AVAILABLE_TO_SPEND_USD: $(jq -r '.account.availableToSpend' /tmp/pacifica.json)"
              echo "AVAILABLE_TO_WITHDRAW_USD: $(jq -r '.account.availableToWithdraw' /tmp/pacifica.json)"
              echo "MARGIN_USED_USD: $(jq -r '.account.marginUsed' /tmp/pacifica.json)"
              echo "MARGIN_USED_VS_EQUITY_PCT: $(jq -r '.account.marginUsedVsEquityPct' /tmp/pacifica.json)"
              echo "MAINTENANCE_MARGIN_USD: $(jq -r '.account.maintenanceMargin' /tmp/pacifica.json)"
              echo "POSITIONS_COUNT: $(jq -r '.account.positionsCount' /tmp/pacifica.json)"
              echo "OPEN_ORDERS_COUNT: $(jq -r '.account.ordersCount' /tmp/pacifica.json)"
              echo "STOP_ORDERS_COUNT: $(jq -r '.account.stopOrdersCount' /tmp/pacifica.json)"
              echo ""
              echo "PACIFICA POSITIONS"
              echo "=================="
              echo -e "SYMBOL\tSIDE\tAMOUNT\tENTRY\tMARK\tNOTIONAL_USD\tUNREALIZED_PNL_USD\tLIQUIDATION\tLIQ_DISTANCE_PCT\tFUNDING_NOW\tFUNDING_NEXT"

              jq -r '
                .positions[]
                | [
                    (.symbol // ""),
                    (.side // ""),
                    (.amount | tostring),
                    (.entryPrice | tostring),
                    (.markPrice | tostring),
                    (.notionalUsd | tostring),
                    (.unrealizedPnlUsd | tostring),
                    (.liquidationPrice | tostring),
                    (.liquidationDistancePct | tostring),
                    (.currentFundingRate | tostring),
                    (.nextFundingRate | tostring)
                  ]
                | @tsv
              ' /tmp/pacifica.json
            else
              echo ""
              echo "PACIFICA POSITIONS: UNAVAILABLE THIS CYCLE"
            fi

            echo ""
            echo "SAFETY"
            echo "======"
            echo "WALLET_ADDRESSES_INCLUDED: false"
            echo "API_KEYS_INCLUDED: false"
            echo "SIGNING_CAPABILITY: false"

          } > public/portfolio.txt

      - name: Create landing page
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>2026Bull Portfolio Feed</title>
            </head>
            <body>
              <h1>2026Bull Portfolio Feed</h1>
              <p><a href="./portfolio.txt">portfolio.txt</a></p>
              <p><a href="./portfolio.json">portfolio.json</a></p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish raw feed branch
        run: |
          cp public/portfolio.json /tmp/portfolio.json
          cp public/portfolio.txt /tmp/portfolio.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan live-feed

          git rm -rf . >/dev/null 2>&1 || true

          cp /tmp/portfolio.json ./portfolio.json
          cp /tmp/portfolio.txt ./portfolio.txt

          git add portfolio.json portfolio.txt
          git commit -m "Update live portfolio feed"

          git push --force origin live-feed
