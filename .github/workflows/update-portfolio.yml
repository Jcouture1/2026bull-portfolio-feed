name: Update Portfolio Feed

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Create public directory
        run: mkdir -p public

      - name: Fetch portfolio feed
        run: |
          curl --fail --silent --show-error \
            "https://2026bull-portfolio-oracle.vercel.app/api/feed" \
            -o public/portfolio.json

      - name: Validate JSON
        run: |
          jq -e '.status == "ok"' public/portfolio.json > /dev/null
          jq -e '.privacy.walletAddressesIncluded == false' public/portfolio.json > /dev/null
          jq -e '.privacy.apiKeysIncluded == false' public/portfolio.json > /dev/null
          jq -e '.privacy.signingCapability == false' public/portfolio.json > /dev/null

      - name: Pretty-print portfolio JSON
        run: |
          jq '.' public/portfolio.json > public/portfolio.pretty.json
          mv public/portfolio.pretty.json public/portfolio.json

      - name: Create readable portfolio feed
        run: |
          {
            echo "UPDATED_AT: $(jq -r '.updatedAt' public/portfolio.json)"
            echo "KNOWN_VALUE_USD: $(jq -r '.summary.knownValueUsd' public/portfolio.json)"
            echo "PRICED_POSITIONS: $(jq -r '.summary.pricedPositions' public/portfolio.json)"
            echo "UNPRICED_POSITIONS: $(jq -r '.summary.unpricedPositions' public/portfolio.json)"
            echo "UNIQUE_ASSETS: $(jq -r '.summary.uniqueAssets' public/portfolio.json)"
            echo ""
            echo "POSITIONS"
            echo -e "SYMBOL\tNAME\tCHAIN\tBALANCE\tPRICE_USD\tVALUE_USD\tCHANGE_24H\tLIQUIDITY_USD"
            jq -r '.positions[] |
              [
                .symbol,
                .name,
                .chain,
                (.balance | tostring),
                ((.priceUsd // "UNPRICED") | tostring),
                ((.valueUsd // "UNPRICED") | tostring),
                ((.priceChange24h // "NA") | tostring),
                ((.liquidityUsd // "NA") | tostring)
              ] | @tsv' public/portfolio.json
          } > public/portfolio.txt

      - name: Create landing page
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>2026Bull Portfolio Feed</title>
            </head>
            <body>
              <h1>2026Bull Portfolio Feed</h1>
              <p><a href="./portfolio.json">portfolio.json</a></p>
              <p><a href="./portfolio.txt">portfolio.txt</a></p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
